<script>
(()=>{'use strict';
let STORAGE='truelife-sim-v2-slot-1';
const $=id=>document.getElementById(id);
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rand(0,a.length-1)];
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const cash=n=>(n<0?'−':'')+'$'+Math.abs(Math.round(n||0)).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cities={"Atlanta, GA":1.03,"Birmingham, AL":0.87,"Chicago, IL":1.17,"Dallas, TX":1.04,"Houston, TX":1.03,"Los Angeles, CA":1.45,"New York, NY":1.59,"Miami, FL":1.27,"Detroit, MI":0.91,"Nashville, TN":1.09};
const occupations=[
{id:'retail',name:'Retail Associate',pay:30500,education:0,skill:0,icon:'🛒',blurb:'Entry-level retail job. Flexible but limited upward mobility.'},
{id:'warehouse',name:'Warehouse Associate',pay:39000,education:0,skill:0,icon:'📦',blurb:'Steady hours, physically demanding work.'},
{id:'food',name:'Restaurant Server',pay:33000,education:0,skill:0,icon:'🍽️',blurb:'Customer service and tips, variable hours.'},
{id:'apprentice',name:'Trade Apprentice',pay:37000,education:0,skill:28,icon:'🔧',blurb:'Learn hands-on skills, earn while training.'},
{id:'office',name:'Office Assistant',pay:35500,education:0,skill:45,icon:'🖥️',blurb:'Administrative work and experience.'},
{id:'helpdesk',name:'IT Support Specialist',pay:52000,education:1,skill:52,icon:'💻',blurb:'Certification and problem solving required.'},
{id:'electrician',name:'Licensed Electrician',pay:67000,education:1,skill:46,icon:'⚡',blurb:'Skilled trade with strong earning potential.'},
{id:'nurse',name:'Registered Nurse',pay:78000,education:2,skill:60,icon:'🏥',blurb:'Clinical training and an associate or higher degree.'},
{id:'teacher',name:'Teacher',pay:56500,education:3,skill:56,icon:'📚',blurb:'Bachelor degree required. Meaningful, demanding work.'},
{id:'accountant',name:'Accountant',pay:73500,education:3,skill:62,icon:'🧮',blurb:'Business and analytical skills required.'},
{id:'software',name:'Software Developer',pay:104000,education:3,skill:72,icon:'⌨️',blurb:'Strong technical skills and a bachelor degree.'},
{id:'manager',name:'Operations Manager',pay:86500,education:2,skill:67,icon:'📊',blurb:'Leadership role. Prior work experience required.',exp:4},
];
const schools=[{id:'cert',name:'Professional Certification',length:1,cost:4900,level:1,boost:9,icon:'🛠️',desc:'Technical, trade, or IT certification.'},{id:'associate',name:'Associate Degree',length:2,cost:8200,level:2,boost:7,icon:'🎓',desc:'Community college degree.'},{id:'bachelor',name:'Bachelor Degree',length:4,cost:16800,level:3,boost:9,icon:'🏛️',desc:'Four-year university.'},{id:'master',name:'Master Degree',length:2,cost:23700,level:4,boost:9,icon:'📖',desc:'Graduate-level studies.'}];
const dwellings=[{id:'family',name:'Live with Family',annual:2400,upfront:0,icon:'🏠',desc:'Contribute to household bills, low cost.'},{id:'roommates',name:'Roommate Apartment',annual:9800,upfront:1200,icon:'🛏️',desc:'Share the rent and utilities.'},{id:'studio',name:'Studio Apartment',annual:15500,upfront:2100,icon:'🏙️',desc:'Privacy comes at a price.'},{id:'nice',name:'Modern Apartment',annual:26600,upfront:3500,icon:'🌆',desc:'Higher rent and better lifestyle.'}];
const statInfo=[['health','❤️','Health','#ff8d97'],['happiness','✨','Happiness','#ffca75'],['smarts','🧠','Knowledge','#83acff'],['social','🤝','Social','#c6a4ff'],['energy','⚡','Energy','#67e1c2'],['stress','🌧️','Stress','#fc98a1']];
const people=['Jordan','Taylor','Alex','Avery','Morgan','Riley','Cameron','Sam','Parker','Casey','Quinn','Drew'];
let state=null, tab='home', popup=null, toastTimer=null;
function fresh(name='Alex Morgan',city='Birmingham, AL',origin='working',fromBirth=false){
 const starts={working:{wealth:2700,smarts:57,health:83,social:49,happiness:67,stress:22},stable:{wealth:7000,smarts:65,health:88,social:54,happiness:74,stress:14},difficult:{wealth:480,smarts:48,health:75,social:43,happiness:58,stress:33}};
 let b=starts[origin]||starts.working;
 return {name,city,origin,age:fromBirth?0:18,year:2026,wealth:fromBirth?0:b.wealth,debt:0,invested:0,credit:680,health:b.health,happiness:b.happiness,smarts:b.smarts,social:b.social,energy:75,stress:b.stress,fitness:51,education:fromBirth?-1:0,school:null,job:null,jobExp:0,experience:0,employedPay:0,housing:'family',car:false,partner:null,partnerScore:0,kids:0,friendScore:42,actions:3,sideIncome:0,gameover:false,pendingEvent:null,log:[{age:fromBirth?0:18,year:2026,icon:'🌱',text:fromBirth?'You were born. Your story begins.':'You stepped into adulthood. Your future is unwritten.'}],totalEarned:0,yearsLived:0,extraChance:0,loanDefault:false};
}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state));$('saved-indicator').textContent='● Autosaved'}catch(e){$('saved-indicator').textContent='◌ Local save unavailable'}}
function load(){try{let o=JSON.parse(localStorage.getItem(STORAGE));if(o&&typeof o.age==='number'&&typeof o.wealth==='number'&&typeof o.name==='string')return o}catch(e){}return null}
function log(text,icon='📝'){state.log.unshift({age:state.age,year:state.year,text,icon});state.log=state.log.slice(0,300)}
function change(obj){for(const [k,v] of Object.entries(obj)){if(['health','happiness','smarts','social','energy','stress','fitness','friendScore','partnerScore'].includes(k))state[k]=clamp((state[k]||0)+v);else state[k]=(state[k]||0)+v}}
function toast(msg){const e=$('toast');e.textContent=msg;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2600)}
function setTab(t){tab=t;render();window.scrollTo({top:0,behavior:'smooth'})}
function occupation(){return occupations.find(j=>j.id===state.job)}
function salary(){const j=occupation();if(!j)return 0;const expMultiplier=1+Math.min(state.jobExp,12)*.035;return Math.round(j.pay*expMultiplier*(cities[state.city]||1))}
function annualExpenses(){let factor=cities[state.city]||1;let house=dwellings.find(x=>x.id===state.housing)||dwellings[0];let food=state.age<18?0:state.housing==='family'?3700:8900;return Math.round((house.annual+food+(state.car?4100:2300))*factor+(state.kids*5100));}
function net(){return state.wealth+state.invested-state.debt}
function activeSchool(){return schools.find(s=>state.school&&s.id===state.school.id)}
function stage(){return state.age<6?'Early Childhood':state.age<13?'School Days':state.age<18?'Teenage Years':state.age<30?'Finding Your Way':state.age<45?'Building a Life':state.age<60?'Midlife':state.age<75?'Later Chapters':'The Golden Years'}
function actionCount(){return state.actions===1?'1 action':`${state.actions} actions`}
function render(){if(!state)return;
 $('playername').textContent=state.name; $('chapter').textContent=`${stage().toUpperCase()} • YEAR ${state.year}`;
 $('playerdesc').textContent=`📍 ${state.city}  ·  ${state.age<18?'Growing up':occupation()?.name||'Currently unemployed'}  ·  ${state.age<18?'Living with family':(dwellings.find(x=>x.id===state.housing)||dwellings[0]).name}`;
 $('age').textContent=state.age; $('networth').textContent=cash(net());$('networth').style.color=net()<0?'var(--red)':'var(--accent)';
 $('avatar').textContent=state.age<4?'👶🏽':state.age<13?'🧒🏽':state.age<60?'🧑🏽':'🧓🏽';
 $('nav').innerHTML=[['home','⌂','Home'],['career','💼','Career'],['money','💳','Finances'],['social','💞','People'],['story','📖','Life story']].map(([id,ico,label])=>`<button class="navbutton ${tab===id?'active':''}" data-tab="${id}" type="button"><span class="ico">${ico}</span>${label}</button>`).join('')+`<div class="sidetip"><div class="eyebrow">THE REALITY CHECK</div><p>Every year brings income, bills, new opportunities and unexpected setbacks. Plan ahead.</p></div>`;
 $('stats').innerHTML=statInfo.map(([key,ico,label,color])=>`<div class="stat"><div class="statlabel"><span>${ico} ${label}</span><em>${Math.round(state[key]||0)}${key==='stress'?'':'%'}</em></div><div class="bar"><i style="width:${clamp(state[key]||0)}%;background:${color}"></i></div></div>`).join('');
 $('content').innerHTML=state.gameover?renderEnding():tab==='home'?renderHome():tab==='career'?renderCareer():tab==='money'?renderMoney():tab==='social'?renderSocial():renderStory();
 document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>setTab(x.dataset.tab));
 document.querySelectorAll('[data-action]').forEach(x=>x.onclick=()=>act(x.dataset.action));
 document.querySelectorAll('[data-job]').forEach(x=>x.onclick=()=>applyJob(x.dataset.job));
 document.querySelectorAll('[data-school]').forEach(x=>x.onclick=()=>enroll(x.dataset.school));
 document.querySelectorAll('[data-home]').forEach(x=>x.onclick=()=>move(x.dataset.home));
 save();
}
function actionButton(id,icon,title,sub,disabled=false){return `<button type="button" class="action" data-action="${id}" ${disabled?'disabled':''}><span class="actionico">${icon}</span><span><strong>${title}</strong><small>${sub}</small></span></button>`}
function feed(limit=6){return `<div class="feed">${state.log.slice(0,limit).map(e=>`<div class="entry"><div class="feedico">${e.icon}</div><div><p>${esc(e.text)}</p><small>AGE ${e.age} · ${e.year}</small></div></div>`).join('')}</div>`}
function ageFooter(){return `<div class="bottomrow"><div><h3>Ready for the next chapter?</h3><p>${actionCount()} remaining this year · Advancing processes finances, education and life events.</p></div><button class="primary" data-action="age">Age up →</button></div>`}
function renderHome(){const a=state.actions<=0;
 return `${ageFooter()}<div class="two"><div><section class="panel"><div class="paneltitle"><h3>What will you do?</h3><span>${actionCount()} left this year</span></div><p class="intro">Your time is limited. Each action can improve a part of your life, but choices have tradeoffs.</p><div class="actiongrid">${state.age>=16?actionButton('sidegig','💵','Pick up side work',state.age<18?'Earn around $150':'Earn around $550',a):actionButton('play','🧩','Play & explore','Happiness + social',a)}${actionButton('study','📚',state.age<18?'Focus on school':'Learn new skills','Knowledge and career preparation',a)}${actionButton('gym','🏋️',state.age<10?'Play outside':'Exercise','Health + fitness · small cost',a)}${actionButton('friends','🫶',state.age<13?'Make friends':'Spend time with friends','Social + happiness · $45',a)}${actionButton('rest','🛌','Take care of yourself','More energy, less stress',a)}${state.age>=16?actionButton('therapy','🩺','See a counselor','Less stress · $180',a):actionButton('family','🏡','Spend family time','Support and happiness',a)}</div></section><section class="panel"><div class="paneltitle"><h3>Your situation</h3><span>Current snapshot</span></div><div class="details"><div class="detail"><label>Current job</label><strong>${esc(occupation()?.name||'None')}</strong></div><div class="detail"><label>Education</label><strong>${educationName()}</strong></div><div class="detail"><label>Housing</label><strong>${state.age<18?'Family home':esc((dwellings.find(x=>x.id===state.housing)||dwellings[0]).name)}</strong></div><div class="detail"><label>Relationships</label><strong>${state.partner?esc(state.partner):'Single'}${state.kids?' · '+state.kids+' children':''}</strong></div></div></section></div><div><section class="panel"><div class="paneltitle"><h3>Latest moments</h3><span>Your timeline</span></div>${feed(7)}<button class="smallbutton" data-action="seeStory" style="margin-top:16px">View full life story →</button></section><section class="panel"><div class="paneltitle"><h3>Next year forecast</h3><span>Estimate</span></div><div class="details"><div class="detail"><label>Gross salary</label><strong class="mint">${cash(salary())}</strong></div><div class="detail"><label>Living costs</label><strong class="gold">${state.age<18?'Covered by family':cash(annualExpenses())}</strong></div><div class="detail"><label>Student program</label><strong>${esc(activeSchool()?.name||'Not enrolled')}</strong></div><div class="detail"><label>Debt balance</label><strong class="${state.debt>0?'red':'mint'}">${cash(state.debt)}</strong></div></div></section></div></div>`;
}
function educationName(){return state.education<0?'Not started':(['High school','Certificate','Associate degree','Bachelor degree','Master degree'][state.education]||'High school')}
function renderCareer(){let eligible=state.age>=18;
 return `${ageFooter()}<section class="panel"><div class="paneltitle"><h3>Your career path</h3><span>Experience ${state.experience} yrs</span></div><div class="moneygrid"><div class="moneybox"><small>Current role</small><strong style="font-size:14px">${esc(occupation()?.name||'Unemployed')}</strong></div><div class="moneybox"><small>Annual pay</small><strong class="mint">${cash(salary())}</strong></div><div class="moneybox"><small>Education</small><strong style="font-size:14px">${educationName()}</strong></div></div>${state.school?`<div class="listcard"><div><h4>🎓 ${esc(activeSchool()?.name||'College')}</h4><p>Year ${state.school.years+1} of ${activeSchool()?.length||1} · Tuition billed yearly · Study to improve outcomes</p></div><span class="chip">ENROLLED</span></div>`:''}<p class="footnote">Work experience raises annual pay by about 3.5% per year in the same job, up to a cap. Changing jobs resets role tenure.</p></section><section class="panel"><div class="paneltitle"><h3>Job opportunities</h3><span>Apply to change roles</span></div><div class="cardlist">${occupations.map(j=>{let allowed=eligible&&(state.age>=18||['retail','food'].includes(j.id))&&state.education>=j.education&&state.smarts>=j.skill&&(!j.exp||state.experience>=j.exp);let missing=[];if(state.age<18&&!['retail','food'].includes(j.id))missing.push('Age 18+');if(state.education<j.education)missing.push(['High school','Certification','Associate degree','Bachelor degree'][j.education]||'Degree');if(state.smarts<j.skill)missing.push('Knowledge '+j.skill);if(j.exp&&state.experience<j.exp)missing.push(j.exp+' yrs work experience');return `<div class="listcard"><div><h4>${j.icon} ${j.name}</h4><p>${j.blurb}</p><div style="margin-top:9px"><span class="chip">${missing.length?'Requires: '+missing.join(' · '):'Qualifications met'}</span></div></div><div class="right"><div class="cost">${cash(j.pay*(cities[state.city]||1))}/yr</div><button class="smallbutton" data-job="${j.id}" ${!allowed||state.job===j.id?'disabled':''}>${state.job===j.id?'Current':'Apply'}</button></div></div>`}).join('')}</div></section><section class="panel"><div class="paneltitle"><h3>Education & training</h3><span>Investment in your future</span></div><div class="cardlist">${schools.map(s=>{let requirement=s.level===4?state.education>=3:s.level===3?state.education>=0:s.level===2?state.education>=0:true;let allowed=state.age>=17&&requirement&&state.education<s.level&&!state.school;return `<div class="listcard"><div><h4>${s.icon} ${s.name}</h4><p>${s.desc} · ${s.length} ${s.length===1?'year':'years'}</p></div><div class="right"><div class="cost neg">${cash(s.cost)}/yr</div><button class="smallbutton" data-school="${s.id}" ${allowed?'':'disabled'}>Enroll</button></div></div>`}).join('')}</div><p class="footnote">Tuition is paid each year from cash or student loans. School adds stress and can limit work-life balance.</p></section>`;
}
function renderMoney(){let annual=annualExpenses(),salaryPay=salary(),tax=Math.round(salaryPay*taxRate(salaryPay));return `${ageFooter()}<section class="panel"><div class="paneltitle"><h3>Personal finances</h3><span>Your money is real</span></div><div class="moneygrid"><div class="moneybox"><small>Cash savings</small><strong class="mint">${cash(state.wealth)}</strong></div><div class="moneybox"><small>Total debt</small><strong class="${state.debt?'red':'mint'}">${cash(state.debt)}</strong></div><div class="moneybox"><small>Investments</small><strong>${cash(state.invested)}</strong></div></div><div class="details"><div class="detail"><label>Estimated take-home pay / yr</label><strong class="mint">${cash(salaryPay-tax)}</strong></div><div class="detail"><label>Annual living costs</label><strong>${state.age<18?'Family supported':cash(annual)}</strong></div><div class="detail"><label>Credit score</label><strong>${state.credit} / 850</strong></div><div class="detail"><label>Estimated net worth</label><strong class="${net()<0?'red':'mint'}">${cash(net())}</strong></div></div><p class="footnote">Estimates are simplified and vary by fictional in-game events. Income tax, expenses, debt interest and investment returns are calculated when you age up.</p></section><section class="panel"><div class="paneltitle"><h3>Manage your money</h3><span>${actionCount()} available</span></div><div class="actiongrid">${actionButton('payDebt','🧾','Pay down debt',`Debt: ${cash(state.debt)}`,state.age<18||state.debt<=0||state.wealth<=0)}${actionButton('invest','📈','Invest savings',`Invested: ${cash(state.invested)}`,state.age<18||state.wealth<500)}${actionButton('withdraw','🏧','Sell investments',`Cash out market assets`,state.invested<=0)}${actionButton('doctor','🩺','Doctor visit','Improve health · $260',state.age<18||state.wealth<260||state.actions<=0)}</div></section><section class="panel"><div class="paneltitle"><h3>Where you live</h3><span>Annual housing expenses</span></div><div class="cardlist">${dwellings.filter(d=>d.id!=='owned').map(d=>`<div class="listcard"><div><h4>${d.icon} ${d.name}</h4><p>${d.desc} · Move-in ${cash(d.upfront*(cities[state.city]||1))}</p></div><div class="right"><div class="cost neg">${cash(d.annual*(cities[state.city]||1))}/yr</div><button class="smallbutton" data-home="${d.id}" ${state.age<18||state.housing===d.id?'disabled':''}>${state.housing===d.id?'Current':'Move'}</button></div></div>`).join('')}</div></section><section class="panel"><div class="paneltitle"><h3>Transportation</h3></div><div class="listcard"><div><h4>🚙 ${state.car?'Used car — owned':'Buy a used car'}</h4><p>${state.car?'Fuel, repairs and insurance are included in living costs.':'A reliable used car for $7,200, plus about $4,100/year for fuel, insurance, and upkeep.'}</p></div><button class="smallbutton" data-action="car" ${state.car||state.age<18?'disabled':''}>${state.car?'Owned':'Buy'}</button></div></section>`}
function renderSocial(){return `${ageFooter()}<section class="panel"><div class="paneltitle"><h3>Your circle</h3><span>Connections take effort</span></div><div class="moneygrid"><div class="moneybox"><small>Friendship strength</small><strong>${Math.round(state.friendScore)}%</strong></div><div class="moneybox"><small>Relationship</small><strong style="font-size:15px">${state.partner?esc(state.partner):'Single'}</strong></div><div class="moneybox"><small>Children</small><strong>${state.kids}</strong></div></div><div class="actiongrid">${actionButton('friends','🎉','Hang out with friends','Maintain your social circle · $45',state.actions<=0)}${actionButton('date','💬',state.partner?'Date night':'Meet someone new',state.partner?'Build your relationship · $120':'Chance to meet a partner · $65',state.age<18||state.actions<=0)}${actionButton('partner','💗','Spend quality time','Grow your connection · $85',!state.partner||state.actions<=0)}${actionButton('marry','💍','Get married','Commit to your partner · $2,000',!state.partner||!!state.married||state.partnerScore<68||state.wealth<2000||state.age<18)}${actionButton('baby','👶','Plan for a child','A long-term family commitment',!state.partner||state.age<18||state.age>53||state.actions<=0)}${actionButton('family','🏡','Visit your family','Improve happiness & support',state.actions<=0)}</div></section><section class="panel"><div class="paneltitle"><h3>Relationships</h3></div>${state.partner?`<div class="listcard"><div><h4>💗 ${esc(state.partner)}</h4><p>${state.married?'Married':'Dating'} · Relationship quality ${Math.round(state.partnerScore)}%</p></div><span class="chip">${state.married?'SPOUSE':'PARTNER'}</span></div><p class="footnote">Relationships change as time passes. If they're neglected, people may drift apart.</p>`:`<div class="empty">You're single. Meet people, build friendships, and see where things go.</div>`}${state.kids?`<div class="listcard" style="margin-top:10px"><div><h4>🧸 Your family</h4><p>${state.kids} ${state.kids===1?'child':'children'} · Parenting adds expenses and happiness.</p></div></div>`:''}</section>`}
function renderStory(){let milestones=state.log.length;return `${ageFooter()}<section class="panel"><div class="paneltitle"><h3>The life of ${esc(state.name)}</h3><span>${milestones} moments</span></div><p class="explain">From the choices you made to the opportunities you missed, this is the story of your life.</p>${feed(80)}</section>`}
function renderEnding(){return `<section class="panel" style="text-align:center;padding:40px 28px"><div style="font-size:65px">🕊️</div><div class="eyebrow" style="margin-top:22px">A LIFE WELL LIVED</div><h2 style="font-size:31px;margin:13px 0 8px">The story of ${esc(state.name)}</h2><p class="explain">Your life ended at age ${state.age}. The decisions you made shaped a story that was entirely yours.</p><div class="moneygrid"><div class="moneybox"><small>Final net worth</small><strong>${cash(net())}</strong></div><div class="moneybox"><small>Lifetime earnings</small><strong>${cash(state.totalEarned)}</strong></div><div class="moneybox"><small>Children</small><strong>${state.kids}</strong></div></div><button class="primary" data-action="newgame">Start another life ↻</button></section><section class="panel"><div class="paneltitle"><h3>Your complete story</h3></div>${feed(80)}</section>`}
function taxRate(pay){return pay<=35000?.14:pay<=60000?.19:pay<=105000?.24:.29}
function needsAction(){if(state.actions<=0){toast('No actions left this year. Age up to continue.');return false}return true}
function useAction(){state.actions=Math.max(0,state.actions-1)}
function spend(n){if(state.wealth<n){toast(`You need ${cash(n)} in available cash.`);return false}state.wealth-=n;return true}
function doSimple(id){if(!needsAction())return;
 if(id==='study'){change({smarts:rand(5,10),energy:-7,stress:rand(2,6),happiness:-2});if(state.school)state.school.studied=(state.school.studied||0)+1;log('You spent time studying and building your knowledge.','📚');}
 if(id==='gym'){if(state.age>=10&&!spend(45))return;change({health:rand(4,8),fitness:rand(6,10),energy:-9,stress:-5,happiness:2});log('You made your physical health a priority.','🏋️');}
 if(id==='friends'){if(state.age>=18&&!spend(45))return;change({social:rand(6,10),happiness:7,friendScore:8,stress:-4,energy:-4});log('You made memories with friends.','🫶');}
 if(id==='rest'){change({health:3,energy:18,stress:-13,happiness:3});log('You slowed down and gave yourself time to recover.','🛌');}
 if(id==='therapy'){if(!spend(180))return;change({stress:-19,happiness:8,health:4});log('You spoke to a counselor and worked through some stress.','🩺');}
 if(id==='doctor'){if(!spend(260))return;change({health:rand(9,15),stress:-3});log('You visited the doctor for a health check.','🩺');}

 // Old handlers are rebound for fresh Wellness content; existing sections keep theirs.
 document.querySelectorAll('#content [data-action]').forEach(x=>x.onclick=()=>act(x.dataset.action));
 document.querySelectorAll('#content [data-v2]').forEach(x=>x.onclick=()=>{if(x.dataset.v2==='openGoals')return renderGoalsModal();extraAction(x.dataset.v2,x.dataset.arg||'')});
 if(state.house)$('playerdesc').textContent=`📍 ${state.city} · ${state.retired?'Retired':occupation()?.name||'Currently unemployed'} · Homeowner`;
 if(state.retired&&!state.house)$('playerdesc').textContent=`📍 ${state.city} · Retired · ${(dwellings.find(x=>x.id===state.housing)||dwellings[0]).name}`;
 $('avatar').textContent=state.age<4?'👶🏽':state.age<13?'🧒🏽':state.age>=60?(state.avatarStyle&&state.avatarStyle.startsWith('👩')?'👵🏽':'🧓🏽'):(state.avatarStyle||'🧑🏽');
 if(state.yearLedger)$('saved-indicator').title=`Last year: ${cash(state.yearLedger.cashChange)} cash flow`;
 save();};
const oldAgeUp=ageUp;
ageUp=function(){if(state.gameover||popup)return;const prevAge=state.age;oldAgeUp();if(state.pet&&state.age>prevAge){state.pet.age++;if(state.pet.age>11&&Math.random()<.08){log(`${state.pet.name} passed away. You will always remember your pet.`,'🐾');state.pet=null;change({happiness:-7});render()}}};
function slotKey(slot){return `truelife-sim-v2-slot-${slot}`}
function switchSlot(slot){save();const s=clamp(Number(slot)||1,1,3);STORAGE=slotKey(s);try{localStorage.setItem('truelife-active-slot',String(s))}catch(e){}state=load();tab='home';popup=state?.pendingEvent?{type:'event',eventId:state.pendingEvent}:state?null:{type:'start'};showPopup();if(state)render();}
function downloadSave(){try{const bytes=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(bytes),a=document.createElement('a');a.href=url;a.download='TRUE_LIFE_'+state.name.replace(/[^a-z0-9]+/gi,'_')+'_age'+state.age+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Your life file is ready.')}catch(e){toast('Could not export save file on this browser.')}}
function openSaveManager(){const cur=Number(STORAGE.slice(-1))||1;const saves=[1,2,3].map(n=>{let o=null;try{o=JSON.parse(localStorage.getItem(slotKey(n)))}catch(e){}return {n,save:o&&typeof o.name==='string'?o:null}});
 popup={type:'slot'};
 $('modalcontainer').innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="Save manager"><div class="eventbadge">SAVE MANAGER</div><h2>Live a thousand lives.</h2><p>Keep up to three different lives on this device. You can also export your character as a JSON backup and import it later.</p>${saves.map(({n,save:s})=>`<button class="choice" data-slot="${n}"><strong>${n===cur?'✓ ':''}Life slot ${n} ${s?'· '+esc(s.name):'· Empty'}</strong><small>${s?`Age ${s.age} · ${esc(s.city||'Unknown city')} · Cash ${cash(s.wealth)}`:'Create a new story'}${n===cur?' · CURRENT SLOT':''}</small></button>`).join('')}<div class="v2-actions" style="margin-top:18px"><button id="exportSave" class="ghost" ${!state?'disabled':''}>⬇ Export life</button><label for="importFile" class="ghost" style="cursor:pointer">⬆ Import life</label><input type="file" id="importFile" accept=".json,application/json" style="display:none" /></div><div class="modalbuttons"><button class="ghost" id="closeSaves">Close</button></div></div></div>`;
 $('closeSaves').onclick=()=>{popup=null;showPopup()};document.querySelectorAll('[data-slot]').forEach(el=>el.onclick=()=>switchSlot(el.dataset.slot));$('exportSave').onclick=()=>downloadSave();$('importFile').onchange=async(e)=>{try{const file=e.target.files?.[0];if(!file||file.size>500000)throw new Error('Choose a save under 500 KB');const t=await file.text(),data=normalize(JSON.parse(t));if(!data)throw new Error('Invalid TRUE LIFE save.');state=data;popup=null;showPopup();tab='home';render();toast('Your character was imported.')}catch(e){toast(e.message||'Import failed.')}}}
const standardPopup=showPopup;
showPopup=function(){standardPopup();if(popup&&popup.type==='start'&&$('beginlife')){
 const startBtn=$('beginlife');
 startBtn.insertAdjacentHTML('beforebegin',`<div class="formrow"><label for="avatarstyle">Character portrait</label><select id="avatarstyle"><option value="🧑🏽">🧑🏽 Person</option><option value="👨🏻">👨🏻 Man (light)</option><option value="👨🏽">👨🏽 Man (medium)</option><option value="👨🏿">👨🏿 Man (dark)</option><option value="👩🏻">👩🏻 Woman (light)</option><option value="👩🏽">👩🏽 Woman (medium)</option><option value="👩🏿">👩🏿 Woman (dark)</option></select></div><div class="formrow"><label for="personality">Natural personality</label><select id="personality"><option value="balanced">Balanced — flexible starting strengths</option><option value="ambitious">Ambitious — performance up, more stress</option><option value="curious">Curious — learning and grades up</option><option value="charismatic">Charismatic — friendships and reputation up</option><option value="resilient">Resilient — handles stress better</option><option value="creative">Creative — media business potential up</option></select></div>`);
 const originalStart=startBtn.onclick;
 startBtn.onclick=()=>{const avatar=$('avatarstyle').value,trait=$('personality').value;originalStart();if(!state)return;state.avatarStyle=avatar;state.personality=trait;
 if(trait==='ambitious'){state.careerPerformance=clamp(state.careerPerformance+12);change({stress:5,smarts:3})}
 if(trait==='curious'){change({smarts:10});state.gpa=clamp(state.gpa+.2,0,4)}
 if(trait==='charismatic'){change({social:10,friendScore:9});state.reputation=clamp(state.reputation+8)}
 if(trait==='resilient'){state.mental=clamp(state.mental+12);change({stress:-12,health:5})}
 if(trait==='creative'){state.skillCreative=clamp(state.skillCreative+16);state.skillBusiness=clamp(state.skillBusiness+5)}
 render();};
 }};
$('manage-life').onclick=()=>openSaveManager();
try{const s=localStorage.getItem('truelife-active-slot');if(['1','2','3'].includes(s))STORAGE=slotKey(s)}catch(e){}

$('newlife').onclick=()=>state?newGamePrompt():(popup={type:'start'},showPopup());
state=load();if(!state){popup={type:'start'};showPopup()}else{if(state.pendingEvent&&events[state.pendingEvent])popup={type:'event',eventId:state.pendingEvent};render();if(popup)showPopup()}
})();
</script>
</body>
